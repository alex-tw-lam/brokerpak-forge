[project]
name = "brokerpak-forge"
version = "0.1.0"
description = "Brokerpak authoring CLI: start from provider binaries, end with a brokerpak"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema>=4",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]
