[project]
name = "brokerpak-forge"
version = "0.1.0"
description = "Brokerpak authoring CLI: start from provider binaries, end with a brokerpak"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pydantic>=2", "pyyaml>=6"]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]
